<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workload Selector</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
            background-color: #282c34;
            color: #61dafb;
        }

        .button {
            width: 200px;
            height: 50px;
            font-size: 18px;
            margin: 10px;
            cursor: pointer;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 8px;
            transition: background-color 0.3s ease;
        }

        .button:hover {
            background-color: #0056b3;
        }
	.red-button {
            background-color: #FE2712;
        }

        .red-button:hover {
            background-color: #B82214;
        }

        .green-button {
            background-color: #58B814;
        }

        .green-button:hover {
            background-color: #3E810E;
        }

        .target-select {
            margin-bottom: 10px;
        }

        .target {
            font-size: 15px;
            padding: 8px 18px;
            margin: 4px;
            cursor: pointer;
            background-color: #3a3f4b;
            color: #9aa0ab;
            border: 1px solid #555;
            border-radius: 20px;
        }

        .target.active {
            background-color: #61dafb;
            color: #282c34;
            border-color: #61dafb;
            font-weight: bold;
        }

        .loading {
            font-size: 24px;
            margin-top: 20px;
            color: #61dafb;
            display: none;
        }

        .terminal {
            width: 80%;
            max-width: 800px;
            height: 300px;
            background-color: #000000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #00ff00;
            resize: none;
            overflow-y: scroll;
            white-space: pre-wrap;
        }

        @media (max-width: 768px) {
            .terminal {
                width: 90%;
                height: 200px;
            }
        }

        @media (max-width: 480px) {
            .terminal {
                width: 95%;
                height: 150px;
            }
        }

        /* Progress bar styles */
        .progress-container {
            width: 80%;
            max-width: 800px;
            background-color: #ddd;
            border-radius: 5px;
            margin-top: 20px;
            display: none; /* Initially hidden */
        }

        .progress-bar {
            width: 0%;
            height: 30px;
            background-color: #4caf50;
            border-radius: 5px;
            transition: width 1s linear;
        }
    </style>
</head>
<body>
    <h1>Workload Selector</h1>

    <!-- Target selector: which toughbook(s) the workload applies to -->
    <div class="target-select" id="target-select">
        <button class="target active" data-target="all" onclick="setTarget(this)">Both</button>
        {% for ip in targets %}
        <button class="target" data-target="{{ ip }}" onclick="setTarget(this)">Unit {{ loop.index }}</button>
        {% endfor %}
    </div>

    <!-- Buttons for the workloads -->
    <button class="button" onclick="runWorkload('f22')">F22</button>
    <button class="button" onclick="runWorkload('b52')">B52</button>
    <button class="button red-button" onclick="runWorkload('f35')">F35</button>
    <button class="button green-button" onclick="runWorkload('f35-fixed')">F35</button>
    <!-- <button class="button" onclick="runWorkload('f22-broken')">F22 - Broken</button> -->
    <!-- <button class="button" onclick="runWorkload('f35-broken')">F35 - Broken</button> -->
    <!-- <button class="button" onclick="runWorkload('b52-broken')">B52 - Broken</button> -->
    <!-- <button class="button" onclick="runWorkload('f22-fixed')">F22 - Fixed</button> -->
    <!-- <button class="button" onclick="runWorkload('b52-fixed')">B52 - Fixed</button> -->
    <button class="button" onclick="runWorkload('base')">Browser</button>

    <div class="loading" id="loading">Executing, please wait...</div>

    <!-- Terminal-like text area for displaying results -->
    <textarea id="terminal" class="terminal" readonly></textarea>

    <!-- Progress Bar Container -->
    <div class="progress-container" id="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <script>
        let selectedTarget = 'all';
        function setTarget(btn) {
            selectedTarget = btn.getAttribute('data-target');
            document.querySelectorAll('.target').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            displayResult(`Target set: ${btn.textContent}`);
        }

        function showLoading() {
            document.getElementById('loading').style.display = 'block';
        }

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }

        function displayResult(output) {
            document.getElementById('terminal').value += output + '\n';
        }

        function showProgressBar() {
            document.getElementById('progress-container').style.display = 'block';
            let progressBar = document.getElementById('progress-bar');
            progressBar.style.width = '0%';  // Reset progress bar

            // Simulate a progress bar incrementing over 60 seconds
            let width = 0;
            let interval = setInterval(function() {
                if (width >= 100) {
                    clearInterval(interval);
                } else {
                    width += (100 / 60);  // Progress increment per second
                    progressBar.style.width = width + '%';
                }
            }, 1000);  // Every 1 second
        }

        function hideProgressBar() {
            document.getElementById('progress-container').style.display = 'none';
        }

        async function runWorkload(workload) {
            showLoading();
            showProgressBar();  // Start showing the progress bar

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 300000);  // Timeout set to 5 minutes

            // Display message in terminal that a workload has been selected
            displayResult(`Workload '${workload}' selected. Awaiting response...`);

            // Start the workload request and progress bar in parallel
            try {
                const switchResponsePromise = fetch(`/workload/${workload}`, {
                    method: 'POST',
                    signal: controller.signal,
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ target: selectedTarget })
                });

                // Wait for workload request to complete
                const switchResponse = await switchResponsePromise;

                clearTimeout(timeoutId);  // Clear the timeout if the request completes

                const data = await switchResponse.json();
                displayResult(data.output || '(no output)');

                if (switchResponse.ok && data.ok) {
                    // Hide the progress bar before initiating reboot
                    hideProgressBar();

                    // Step 2: After a confirmed success, initiate reboot
                    displayResult(`Workload '${workload}' switched successfully. Initiating reboot...`);
                    await rebootSystem();
                } else {
                    displayResult(`>>> WORKLOAD SWITCH FAILED. Target NOT rebooted.`);
                    hideProgressBar();  // Hide progress bar if there's an error
                }
            } catch (error) {
                if (error.name === 'AbortError') {
                    displayResult('Request timed out. The switch operation took too long.');
                } else {
                    displayResult(`An error occurred: ${error.message}`);
                }
                hideProgressBar();  // Hide progress bar in case of error or timeout
            } finally {
                hideLoading();
            }
        }

        // Function to call the reboot endpoint
        async function rebootSystem() {
            try {
                const response = await fetch('/reboot', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ target: selectedTarget })
                });
                const data = await response.json();
                if (response.ok && data.ok) {
                    displayResult(`System reboot initiated.\n${data.output || ''}`);
                } else {
                    displayResult(`>>> REBOOT FAILED.\n${data.output || ''}`);
                }
            } catch (error) {
                displayResult(`An error occurred during reboot: ${error.message}`);
            }
        }
    </script>
</body>
</html>
